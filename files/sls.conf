srt {
    worker_threads 1;
    worker_connections 200;
    http_port 8181;
    cors_header *;
    api_keys belabox_sls_api_key_2026;
    log_file /dev/stdout;
    log_level info;
    #stat_post_url http://localhost:3000/sls/stats;
    #stat_post_interval 1; # in seconds

    server {
        # Player port - all streams playable here regardless of how they were published
        listen_player 4000;           # Players connect here: srt://<host>:4000?streamid=play/live/<stream>
        # Publisher ports - use the appropriate one based on connection type:
        listen_publisher 4001;        # Direct SRT publishers (OBS, FFmpeg without SRTLA)
        listen_publisher_srtla 4002;  # SRTLA publishers (via srtla_rec, bonded cellular) 
        
        # Legacy single port (kept for backwards compatibility)
        listen 8282;                  # Legacy port

        latency_min 500;               # Minimum SRT latency (ms), floor for both publisher and player listeners. 500ms widens the egress TSBPD window (~625KB in-flight at 10Mbps) so viewer-side jitter recovers via retransmit instead of dropping packets (forward skips).
        latency_max 5000;              # Maximum latency for all connections (ms) - prevents excessive delays
        domain_player play;
        domain_publisher live;
        default_sid play/stream/belabox;
        backlog 100;
        idle_streams_timeout 10;
        on_event_url http://127.0.0.1:3000/sls/event; #?method=on_connect|on_close&role_name=&srt_url=%s

        app {
            app_publisher stream;
            app_player stream;
        }
    }
}
