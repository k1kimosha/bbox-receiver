services:
    belabox-receiver:
        container_name: belabox-receiver
        env_file:
            - .env
        ports:
            - '5000:5000/udp'
            - '4000:4000/udp'
            - '4001:4001/udp'
            - '8181:8181'
            - '8282:8282/udp'
            - '3000:3000'
        volumes:
            - './config.json:/app/config.json'
        build: .
